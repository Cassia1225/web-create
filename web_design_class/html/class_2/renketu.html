<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セルの連結</title>
</head>
<body>
    <table border="1">
        <tr>
            <td colspan="2">2つの項目を連結</td>
        </tr>
        <tr>
            <td>1</td><td>2</td>
        </tr>
    </table>

    <table border="1">
        <tr>
            <td rowspan="2">2つの項目を連結</td>
            <td>1</td>
        </tr>
        <tr>
            <td>2</td>
        </tr>

    </table>
</body>
</html>
