<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .parent {
            border: 2px solid #000;
            font-size: 20px;
        }
        .child {
            border: 2px solid #1cecd8;
            font-size: 1.5em;
            margin: 3em;
            padding: 2em;
        }

        .hero {
            width: 100%;
            min-height: 50vh;
        }
    </style>
</head>
<body>
    <div class="parent">
        <p class="child">こんにちは</p>
    </div>

    <div class="hero">
        <h1>hero</h1>
    </div>
</body>
</html>
