<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォームの部品</title>
    <link rel="stylesheet" href="./../css/form_prac.css">
    
</head>
<body>
    <form action="#">
        <div id="a">
            <input type="checkbox">チェックボックス
        </div>
        <div id="b">
            <input type="radio">ラジオボタン
            ファイル選択：<input type="file">
            パスワード：<input type="password">
            テキストフィールド: <input type="text">
        </div>
        <div>
            <textarea rows="5" cols="50">
                テキストエリア
            </textarea>
        </div>

        <div>
            <select id="sel">
                <option value="q">選択１</option>
                <option value="p">選択2</option>
            </select>
        </div>

        <div>
            <input type="button" value="ボタン">
            <input type="submit" value="送信ボタン">
            <input type="reset" value="リセットボタン">
        </div>
        
    </form>
</body>
</html>
